<!doctype html>
<!-- site/og.html — source of public/og-image.png (1200×630). Render with headless Edge/Chrome:
     msedge --headless --hide-scrollbars --window-size=1200,630 --screenshot=public/og-image.png site/og.html -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif; background: #F1F1EF; color: #141416; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .b1 { width: 520px; height: 520px; background: #D9D9D6; left: -120px; top: -160px; }
  .b2 { width: 460px; height: 460px; background: #CFCFCB; right: -100px; bottom: -180px; }
  .card { position: absolute; inset: 56px; border-radius: 44px; background: rgba(255,255,255,.72); border: 1px solid rgba(0,0,0,.06); box-shadow: 0 30px 80px rgba(0,0,0,.08); padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 22px; }
  .top img { width: 92px; height: 92px; border-radius: 24px; }
  h1 { font-size: 96px; letter-spacing: -.05em; margin: 0; line-height: 1; font-weight: 800; }
  p { font-size: 40px; letter-spacing: -.035em; margin: 0; font-weight: 700; line-height: 1.3; }
  p span { color: #6B6B70; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chips i { font-style: normal; font-size: 24px; font-weight: 650; padding: 10px 20px; border-radius: 999px; background: #141416; color: #fff; }
  .chips i.l { background: transparent; color: #141416; box-shadow: inset 0 0 0 2px rgba(0,0,0,.14); }
</style>
</head>
<body>
<i class="blob b1"></i><i class="blob b2"></i>
<div class="card">
  <div class="top"><img src="../public/icons/icon-512.png" alt=""><h1>하루</h1></div>
  <p>할 일부터 수면·가계부까지,<br><span>오늘 하루를 한곳에서.</span></p>
  <div class="chips"><i>할 일</i><i>목표</i><i>루틴</i><i class="l">뽀모도로</i><i class="l">파워냅</i><i class="l">가계부</i><i class="l">수면 관리</i><i class="l">메모 · 일기</i></div>
</div>
</body>
</html>
